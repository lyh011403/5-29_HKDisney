<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>地圖座標拾取器</title>
  <style>
    body {
      margin: 0;
      background: #222;
      color: #fff;
      font-family: sans-serif;
    }
    #picker-container {
      position: relative;
      display: inline-block;
    }
    #park-map {
      display: block;
      width: 740px;
      height: 865px;
    }
    #console-panel {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 320px;
      height: 90vh;
      background: rgba(0,0,0,0.85);
      border: 1px solid #444;
      padding: 15px;
      overflow-y: auto;
      font-family: monospace;
      z-index: 100;
      border-radius: 8px;
    }
    .log-item {
      border-bottom: 1px solid #333;
      padding: 6px 0;
      font-size: 12px;
    }
    .marker-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ff0055;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 10px #ff0055;
    }
    h3 { margin-top: 0; }
  </style>
</head>
<body>
  <div id="picker-container">
    <img src="./地圖.png?v=2" id="park-map" alt="Park Map">
    <div id="dots-container"></div>
  </div>

  <div id="console-panel">
    <h3>座標拾取紀錄</h3>
    <p>請依序點擊地圖上的對應標籤中心，並複製右側輸出的座標。</p>
    <div id="log-list"></div>
  </div>

  <script>
    const parkMap = document.getElementById('park-map');
    const logList = document.getElementById('log-list');
    const dotsContainer = document.getElementById('dots-container');

    parkMap.addEventListener('click', (e) => {
      const rect = parkMap.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
      const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);

      // 建立臨時紅點
      const dot = document.createElement('div');
      dot.className = 'marker-dot';
      dot.style.left = `${x}%`;
      dot.style.top = `${y}%`;
      dotsContainer.appendChild(dot);

      // 輸出 Log
      const log = document.createElement('div');
      log.className = 'log-item';
      log.textContent = `x: ${x}, y: ${y}`;
      logList.insertBefore(log, logList.firstChild);

      console.log(`PICKED -> x: ${x}, y: ${y}`);
    });
  </script>
</body>
</html>
